name: CI

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Keep only the newest run for each PR or branch. PR events are grouped by
# PR number (stable across synchronize/reopened events); non-PR events use ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.crc_impl }})
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        crc_impl: [PW_CHECKSUM_CRC32_4BITS, PW_CHECKSUM_CRC32_1BITS]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize submodules (shallow)
        run: |
          git submodule update --init --recursive --depth 1

# Keep this pin synchronized with the Bridge repository; .bazelversion selects Bazel 9.3.3.
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          bazelisk-version: 1.30.0
          repository-cache: true
          disk-cache: ${{ runner.os }}-${{ github.workflow }}-${{ matrix.crc_impl }}

      - name: Build and test AVR peripheral backends against upstream Pigweed
        if: matrix.crc_impl == 'PW_CHECKSUM_CRC32_4BITS'
        run: |
          bazel test //tests/host:peripheral_backends_upstream_test --test_output=errors

      - name: Upload resolved Bzlmod lockfile
        if: always() && matrix.crc_impl == 'PW_CHECKSUM_CRC32_4BITS' && hashFiles('MODULE.bazel.lock') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bazel-module-lockfile-avr
          path: MODULE.bazel.lock
          if-no-files-found: warn

      - name: Verify Bzlmod lockfile is reproducible
        if: matrix.crc_impl == 'PW_CHECKSUM_CRC32_4BITS'
        run: bazel test --lockfile_mode=error //tests/host:peripheral_backends_upstream_test --test_output=errors
      - name: Commit resolved Bzlmod lockfile to PR branch
        if: matrix.crc_impl == 'PW_CHECKSUM_CRC32_4BITS' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          lockfile="$(mktemp)"
          cp MODULE.bazel.lock "$lockfile"
          git fetch origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          lockfile_worktree="$(mktemp -d)"
          rmdir "$lockfile_worktree"
          git worktree add -B "$HEAD_REF" "$lockfile_worktree" "origin/$HEAD_REF"
          cp "$lockfile" "$lockfile_worktree/MODULE.bazel.lock"
          git -C "$lockfile_worktree" add MODULE.bazel.lock
          if ! git -C "$lockfile_worktree" diff --cached --quiet -- MODULE.bazel.lock; then
            git -C "$lockfile_worktree" config user.name "github-actions[bot]"
            git -C "$lockfile_worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$lockfile_worktree" commit -m "build(bazel): lock resolved Bzlmod dependencies"
            git -C "$lockfile_worktree" push origin "HEAD:refs/heads/$HEAD_REF"
          fi
          git worktree remove "$lockfile_worktree" --force

      - name: Audit exact pinned Pigweed RPC and transfer sources
        run: |
          bash tools/ci/audit_pigweed_rpc.sh

      - name: Verify Pigweed AVR patch idempotence and reviewed patch file
        run: |
          bash tools/ci/check_pigweed_patches.sh

      - name: Upload pinned Pigweed source audit
        if: always() && matrix.crc_impl == 'PW_CHECKSUM_CRC32_4BITS'
        uses: actions/upload-artifact@v4
        with:
          name: pw-upstream-audit
          path: build/pw-upstream-audit.txt
          if-no-files-found: error

      - name: Install AVR Toolchain & simavr
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Bound repository refresh and package installation so a transient
          # Ubuntu mirror or lock cannot stall both matrix jobs indefinitely.
          bash tools/ci/apt_update_with_fallback.sh

          sudo timeout --signal=TERM --kill-after=30s 900s apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=120 \
            install -y --no-install-recommends \
              gcc-avr avr-libc binutils-avr gdb-avr cmake ninja-build simavr \
              libsimavr-dev protobuf-compiler libprotobuf-dev python3-protobuf python3-jinja2 python3-serial python3-psutil ccache

          avr-gcc --version
          avr-gdb --version | head -n1
          protoc --version
          simavr --help >/dev/null 2>&1 || test "$?" -eq 1
          ccache --set-config=max_size=500M

      - name: Compute compiler and dependency cache identity
        id: cache-identity
        run: |
          AVR_GCC_VERSION="$(avr-g++ -dumpfullversion -dumpversion)"
          PIGWEED_REV="$(git rev-parse HEAD:third_party/pigweed)"
          CCACHE_VERSION="$(ccache --version | head -n1 | tr ' ' '-')"
          echo "value=avr-gcc-${AVR_GCC_VERSION}-pigweed-${PIGWEED_REV}-${CCACHE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ matrix.crc_impl }}-${{ steps.cache-identity.outputs.value }}-${{ hashFiles('CMakeLists.txt', 'avr-toolchain.cmake', 'tools/pw_emu_avr/CMakeLists.txt', 'tools/pw_emu_avr/simavr_pty_runner.c') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.crc_impl }}-${{ steps.cache-identity.outputs.value }}-

      - name: Build host-side pw_emu simavr runner
        if: matrix.crc_impl == 'PW_CHECKSUM_CRC32_4BITS'
        run: |
          cmake -S tools/pw_emu_avr -B build/pw_emu_avr -G Ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build/pw_emu_avr

      - name: Test pw_emu simavr runner and full pw_emu_avr suite
        if: matrix.crc_impl == 'PW_CHECKSUM_CRC32_4BITS'
        run: |
          python3 -m py_compile tools/pw_emu_avr/python/pw_emu_avr/*.py tools/pw_emu_avr/tests/*.py
          PYTHONPATH="$GITHUB_WORKSPACE/tools/pw_emu_avr/python:$GITHUB_WORKSPACE/third_party/pigweed/pw_emu/py:$GITHUB_WORKSPACE/third_party/pigweed/pw_env_setup/py" python3 -m unittest discover -s tools/pw_emu_avr/tests -v

      - name: Build and run host C++ backend and atomic shim unit tests
        if: matrix.crc_impl == 'PW_CHECKSUM_CRC32_4BITS'
        run: |
          mkdir -p build/host
          g++ -std=c++20 -Wall -Wextra -Werror -fno-builtin \
            -DPW_METRIC_AVR_HOST_TEST \
            -Itests/host/stubs \
            -Ipw_chrono_avr/public \
            -Ipw_spi_avr/public \
            -Ipw_digital_io_avr/public \
            -Ipw_analog_avr/public \
            -Ipw_transfer_avr/public \
            tests/host/test_avr_port_backends.cpp \
            pw_chrono_avr/src/system_timer.cpp \
            pw_spi_avr/src/initiator.cpp \
            pw_digital_io_avr/src/digital_io.cpp \
            pw_metric_avr/src/atomic_avr.cpp \
            -o build/host/test_avr_port_backends
          ./build/host/test_avr_port_backends

      - name: Configure CMake (${{ matrix.crc_impl }})
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=avr-toolchain.cmake \
            -DAVR_MCU=atmega2560 \
            -DAVR_F_CPU=16000000UL \
            -DAVR_CRC32_IMPL=${{ matrix.crc_impl }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Firmware and Test Runner
        run: |
          if ! cmake --build build --target all > build/build.log 2>&1; then
            tail -n 160 build/build.log
            exit 1
          fi
          tail -n 20 build/build.log

      - name: Report SHA-256 stack usage
        run: |
          # Build a diagnostic-only object from Ninja's real compiler argv.
          # Do not depend on CMake target flags or ccache side-output behavior.
          python3 - <<'PY'
          import pathlib
          import shlex
          import subprocess

          commands = subprocess.check_output(
              ["ninja", "-C", "build", "-t", "commands"], text=True
          ).splitlines()
          argv = None
          for command in commands:
              candidate = shlex.split(command)
              if any(arg.endswith("sha256_avr.cpp") for arg in candidate):
                  argv = candidate
                  break
          if argv is None:
              raise SystemExit("Could not find SHA-256 compile command in Ninja graph")

          compiler_index = next(
              (i for i, arg in enumerate(argv)
               if pathlib.Path(arg).name == "avr-g++"),
              None,
          )
          if compiler_index is None:
              raise SystemExit(f"Unexpected SHA-256 compiler command: {argv[:8]}")
          argv = argv[compiler_index:]

          # Remove dependency-file arguments and redirect the object to /tmp.
          clean = []
          skip_next = False
          for arg in argv:
              if skip_next:
                  skip_next = False
                  continue
              if arg in ("-MF", "-MT", "-MQ"):
                  skip_next = True
                  continue
              if arg == "-o":
                  clean.extend(["-o", "/tmp/sha256_stack_usage.o"])
                  skip_next = True
                  continue
              if arg == "-flto" or arg.startswith("-flto="):
                  continue
              clean.append(arg)

          clean.extend(["-fno-lto", "-fstack-usage"])
          print("Running diagnostic compile:", shlex.join(clean))
          subprocess.run(clean, check=True)
          report = pathlib.Path("/tmp/sha256_stack_usage.su")
          if not report.is_file() or report.stat().st_size == 0:
              matches = list(pathlib.Path("/tmp").glob("*.su"))
              raise SystemExit(f"Stack report missing; found: {matches}")
          print(report.read_text())
          PY

      - name: Measure application firmware and test runner on ATmega2560
        if: matrix.crc_impl == 'PW_CHECKSUM_CRC32_4BITS'
        run: |
          echo "=== ATmega2560 application firmware ==="
          avr-size --format=avr --mcu=atmega2560 build/firmware.elf
          echo "=== ATmega2560 test runner ==="
          avr-size --format=avr --mcu=atmega2560 build/test_runner.elf
          DATA_BYTES="$(avr-size -A build/firmware.elf | awk '$1 == ".data" {d=$2} $1 == ".bss" {b=$2} $1 == ".noinit" {n=$2} END {print d+b+n}')"
          echo "ATmega2560 firmware static SRAM: ${DATA_BYTES} bytes / 8192 bytes"
          echo "ATmega2560 firmware static SRAM remaining before stack/heap: $((8192-DATA_BYTES)) bytes"
          test "$DATA_BYTES" -le 6144

      - name: Build upstream pw_transfer probe (ATmega1284P)
        run: |
          cmake -B build-transfer -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=avr-toolchain.cmake \
            -DAVR_MCU=atmega1284p \
            -DAVR_F_CPU=16000000UL \
            -DAVR_CRC32_IMPL=${{ matrix.crc_impl }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          if ! cmake --build build-transfer --target pw_transfer_upstream_probe.elf pw_rpc_upstream_probe.elf > build-transfer/transfer-build.log 2>&1; then
            tail -n 160 build-transfer/transfer-build.log
            exit 1
          fi
          tail -n 30 build-transfer/transfer-build.log

      - name: Run upstream pw_rpc unary and bidirectional probe (ATmega1284P)
        run: |
          # The two-endpoint HDLC/RPC probe needs more SRAM than ATmega328P.
          set +e
          timeout 5s simavr -m atmega1284p build-transfer/pw_rpc_upstream_probe.elf > build-transfer/pw_rpc_probe.log 2>&1
          simavr_status=$?
          set -e
          cat build-transfer/pw_rpc_probe.log
          echo "simavr exit status: ${simavr_status}; UART marker is authoritative"
          grep -q "PW_RPC_PROBE_PASS" build-transfer/pw_rpc_probe.log

      - name: Run cooperative pw_transfer probe (ATmega1284P)
        run: |
          # The UART marker is emitted only after all transfer assertions.
          set +e
          timeout 5s simavr -m atmega1284p build-transfer/pw_transfer_upstream_probe.elf > build-transfer/pw_transfer_probe.log 2>&1
          simavr_status=$?
          set -e
          cat build-transfer/pw_transfer_probe.log
          echo "simavr exit status: ${simavr_status}; UART marker is authoritative"
          grep -q "PW_TRANSFER_PROBE_PASS" build-transfer/pw_transfer_probe.log

      - name: Run Pigweed AVR Test Suite in simavr
        run: |
          if ! simavr -m atmega2560 build/test_runner.elf > build/test_runner.log 2>&1; then
            cat build/test_runner.log
            exit 1
          fi
          cat build/test_runner.log
          grep -q "100% OF PORTED PIGWEED MODULES VERIFIED OK!" build/test_runner.log
          ccache --show-stats

      - name: Install Arduino CLI and AVR core
        if: matrix.crc_impl == 'PW_CHECKSUM_CRC32_4BITS'
        run: |
          ARDUINO_CLI_VERSION=1.2.2
          mkdir -p "$RUNNER_TEMP/arduino-cli"
          curl -fsSL "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/arduino-cli"
          echo "$RUNNER_TEMP/arduino-cli" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/arduino-cli:$PATH"
          arduino-cli version
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Verify Python Host Tools & Arduino Export
        if: matrix.crc_impl == 'PW_CHECKSUM_CRC32_4BITS'
        run: |
          python3 -m py_compile tools/receive_telemetry.py tools/export_arduino_library.py
          python3 tools/export_arduino_library.py
          required_files=(
            dist/PigweedAVR/src/pw_rpc/internal/packet.pwpb.h
            dist/PigweedAVR/src/pw_rpc/server.h
            dist/PigweedAVR/src/pw_rpc/client.h
            dist/PigweedAVR/src/pw_rpc_client.cpp
            dist/PigweedAVR/src/pw_rpc_client_call.cpp
            dist/PigweedAVR/src/pw_containers/vector.h
            dist/PigweedAVR/src/pw_protobuf/encoder.h
            dist/PigweedAVR/src/pw_transfer/transfer_thread.h
            dist/PigweedAVR/src/pw_transfer/transfer.pwpb.h
            dist/PigweedAVR/src/pw_transfer/cooperative_handler_registration.h
            dist/PigweedAVR/src/assert_avr.cpp
            dist/PigweedAVR/src/atomic_avr.cpp
            dist/PigweedAVR/src/pw_metric/metric.h
            dist/PigweedAVR/src/pw_metric/global.h
            dist/PigweedAVR/src/pw_metric/metric_service_pwpb.h
            dist/PigweedAVR/src/pw_metric_proto/metric_service.pwpb.h
            dist/PigweedAVR/src/pw_metric_proto/metric_service.raw_rpc.pb.h
            dist/PigweedAVR/src/pw_metric_metric.cpp
            dist/PigweedAVR/src/pw_metric_metric_walker.cpp
            dist/PigweedAVR/src/pw_metric_metric_service_pwpb.cpp
            dist/PigweedAVR/src/pw_transfer_transfer_thread.cpp
            dist/PigweedAVR/src/array
          )
          for required_file in "${required_files[@]}"; do
            if [ ! -s "$required_file" ]; then
              echo "::error::Missing or empty Arduino export component: $required_file"
              find dist/PigweedAVR/src -maxdepth 2 -type f | sort | tail -n 80
              exit 1
            fi
          done
          if [ -e dist/PigweedAVR/src/pw_assert_examples.cpp ] || [ -e dist/PigweedAVR/src/pw_assert_pw_assert_examples.cpp ]; then
            find dist/PigweedAVR/src -maxdepth 1 -type f -iname "*assert*example*" -print
            echo "::error::Unexpected assertion example source in Arduino export"
            exit 1
          fi
          mapfile -t cc_files < <(find dist/PigweedAVR/src -maxdepth 1 -type f -name '*.cc' -print | sort)
          if [ "${#cc_files[@]}" -ne 0 ]; then
            printf 'Unexpected .cc source: %s\n' "${cc_files[@]}"
            echo "::error::Arduino export contains .cc files that Arduino CLI does not compile"
            exit 1
          fi
          if ! grep -q "define PW_TRANSFER_COOPERATIVE 1" dist/PigweedAVR/src/pw_transfer/transfer_thread.h; then
            echo "::error::Exported transfer_thread.h is missing the cooperative upstream patch"
            exit 1
          fi
          avr-g++ -mmcu=atmega2560 -DF_CPU=16000000UL -std=gnu++17 \
            -fsyntax-only -Idist/PigweedAVR/src tools/ci/arduino_export_probe.cpp
          # Use the same modern AVR toolchain as the CMake port build. The
          # Arduino AVR core's bundled GCC 7.3 is too old for avr-libstdcpp.
          AVR_TOOLCHAIN_DIR="$(dirname "$(command -v avr-g++)")"
          AVR_GCC_MAJOR="$(avr-g++ -dumpversion | cut -d. -f1)"
          # Install the exported library in the standard Arduino sketchbook
          # path so the CLI's dependency resolver compiles its src/*.cpp files.
          mkdir -p "$HOME/Arduino/libraries" "$HOME/Arduino/libraries/Nanopb/src"
          rm -rf "$HOME/Arduino/libraries/PigweedAVR"
          cp -a dist/PigweedAVR "$HOME/Arduino/libraries/"
          # Select the matching versioned avr-libstdcpp header tree and place
          # it in compiler.cpp.extra_flags (ahead of cores/arduino) so C++17
          # <new> (std::launder, aligned operator new) is not shadowed by the
          # Arduino AVR core's C++11 cores/arduino/new, while keeping
          # PigweedAVR/src out of extra_flags so Arduino CLI discovers and
          # compiles PigweedAVR's translation units.
          if [ "$AVR_GCC_MAJOR" -ge 16 ]; then
            AVR_STDCPP_INC="$HOME/Arduino/libraries/PigweedAVR/gcc16/include"
          elif [ "$AVR_GCC_MAJOR" -ge 14 ]; then
            AVR_STDCPP_INC="$HOME/Arduino/libraries/PigweedAVR/gcc15/include"
          elif [ "$AVR_GCC_MAJOR" -ge 13 ]; then
            AVR_STDCPP_INC="$HOME/Arduino/libraries/PigweedAVR/gcc13/include"
          elif [ "$AVR_GCC_MAJOR" -ge 11 ]; then
            AVR_STDCPP_INC="$HOME/Arduino/libraries/PigweedAVR/gcc12/include"
          else
            AVR_STDCPP_INC="$HOME/Arduino/libraries/PigweedAVR/gcc10/include"
          fi
          test -d "$AVR_STDCPP_INC"
          # The Bridge application supplies Nanopb separately; mirror its
          # pinned runtime dependency (nanopb-0.4.9.3) without bundling
          # duplicate pb_* symbols in PigweedAVR.
          NANOPB_REVISION="$(tr -d '[:space:]' < tools/ci/nanopb_revision.txt)"
          test "$NANOPB_REVISION" = "160d4f09e5fabb2b66aa2dea32d4f38ace2c4b3f"
          NANOPB_BASE="https://raw.githubusercontent.com/nanopb/nanopb/${NANOPB_REVISION}"
          for file in pb.h pb_common.h pb_common.c pb_decode.h pb_decode.c pb_encode.h pb_encode.c; do
            curl -fsSL "$NANOPB_BASE/$file" -o "$HOME/Arduino/libraries/Nanopb/src/$file"
            test -s "$HOME/Arduino/libraries/Nanopb/src/$file"
          done
          cat > "$HOME/Arduino/libraries/Nanopb/library.properties" <<'EOF'
          name=Nanopb
          version=0.4.9.3
          author=nanopb
          maintainer=nanopb
          sentence=Zero-copy Protocol Buffers runtime
          paragraph=Pinned Nanopb runtime used by Pigweed pw_rpc nanopb bindings.
          category=Communication
          architectures=*
          includes=pb.h
          EOF
          # Compile and link a real Arduino sketch against the exported library.
          # Syntax-only compilation cannot catch missing upstream source symbols.
          arduino-cli compile \
            --fqbn arduino:avr:mega \
            --build-property "compiler.path=${AVR_TOOLCHAIN_DIR}/" \
            --build-property "compiler.cpp.extra_flags=-std=gnu++17 -D__cpp_lib_endian=201907L -I${AVR_STDCPP_INC}" \
            --libraries "$HOME/Arduino/libraries" \
            --verbose \
            --build-path build/arduino-transfer-export-probe \
            tests/arduino_transfer_export_probe
          avr-size --format=avr --mcu=atmega2560 \
            build/arduino-transfer-export-probe/arduino_transfer_export_probe.ino.elf
          arduino-cli compile \
            --fqbn arduino:avr:mega \
            --build-property "compiler.path=${AVR_TOOLCHAIN_DIR}/" \
            --build-property "compiler.cpp.extra_flags=-std=gnu++17 -D__cpp_lib_endian=201907L -I${AVR_STDCPP_INC}" \
            --libraries "$HOME/Arduino/libraries" \
            --verbose \
            --build-path build/arduino-metric-export-probe \
            tests/arduino_metric_export_probe
          avr-size --format=avr --mcu=atmega2560 \
            build/arduino-metric-export-probe/arduino_metric_export_probe.ino.elf

      - name: Upload Build Artifacts
        if: matrix.crc_impl == 'PW_CHECKSUM_CRC32_4BITS'
        uses: actions/upload-artifact@v4
        with:
          name: avr-pigweed-firmware
          path: |
            build/firmware.hex
            build/firmware.lst
            build/test_runner.elf
            
