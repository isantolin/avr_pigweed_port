name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Keep only the newest run for each PR or branch. PR events are grouped by
# PR number (stable across synchronize/reopened events); non-PR events use ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.crc_impl }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      matrix:
        crc_impl: [PW_CHECKSUM_CRC32_4BITS, PW_CHECKSUM_CRC32_1BITS]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize submodules (shallow)
        run: |
          git submodule update --init --recursive --depth 1

      - name: Audit exact pinned Pigweed RPC and transfer sources
        run: |
          bash tools/ci/audit_pigweed_rpc.sh

      - name: Upload pinned Pigweed source audit
        if: always() && matrix.crc_impl == 'PW_CHECKSUM_CRC32_4BITS'
        uses: actions/upload-artifact@v4
        with:
          name: pw-upstream-audit
          path: build/pw-upstream-audit.txt
          if-no-files-found: error

      - name: Install AVR Toolchain & simavr
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Bound repository refresh and package installation so a transient
          # Ubuntu mirror or lock cannot stall both matrix jobs indefinitely.
          bash tools/ci/apt_update_with_fallback.sh

          sudo timeout --signal=TERM --kill-after=30s 300s apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=120 \
            install -y --no-install-recommends \
              gcc-avr avr-libc binutils-avr cmake ninja-build simavr \
              libsimavr-dev protobuf-compiler libprotobuf-dev python3-protobuf python3-jinja2 python3-serial python3-psutil ccache

          avr-gcc --version
          protoc --version
          simavr --help >/dev/null 2>&1 || test "$?" -eq 1
          ccache --set-config=max_size=500M

      - name: Compute compiler and dependency cache identity
        id: cache-identity
        run: |
          AVR_GCC_VERSION="$(avr-g++ -dumpfullversion -dumpversion)"
          PIGWEED_REV="$(git rev-parse HEAD:third_party/pigweed)"
          CCACHE_VERSION="$(ccache --version | head -n1 | tr ' ' '-')"
          echo "value=avr-gcc-${AVR_GCC_VERSION}-pigweed-${PIGWEED_REV}-${CCACHE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ matrix.crc_impl }}-${{ steps.cache-identity.outputs.value }}-${{ hashFiles('CMakeLists.txt', 'avr-toolchain.cmake', 'tools/pw_emu_avr/CMakeLists.txt', 'tools/pw_emu_avr/simavr_pty_runner.c') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.crc_impl }}-${{ steps.cache-identity.outputs.value }}-

      - name: Build host-side pw_emu simavr runner
        if: matrix.crc_impl == 'PW_CHECKSUM_CRC32_4BITS'
        run: |
          cmake -S tools/pw_emu_avr -B build/pw_emu_avr -G Ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build/pw_emu_avr

      - name: Test pw_emu simavr runner and UART PTY lifecycle
        if: matrix.crc_impl == 'PW_CHECKSUM_CRC32_4BITS'
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/tools/pw_emu_avr/python:$GITHUB_WORKSPACE/third_party/pigweed/pw_emu/py:$GITHUB_WORKSPACE/third_party/pigweed/pw_env_setup/py" python3 -m unittest discover -s tools/pw_emu_avr/tests -v

      - name: Configure CMake (${{ matrix.crc_impl }})
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=avr-toolchain.cmake \
            -DAVR_MCU=atmega328p \
            -DAVR_F_CPU=16000000UL \
            -DAVR_CRC32_IMPL=${{ matrix.crc_impl }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Firmware and Test Runner
        run: |
          if ! cmake --build build --target all > build/build.log 2>&1; then
            tail -n 160 build/build.log
            exit 1
          fi
          tail -n 20 build/build.log

      - name: Build upstream pw_transfer probe (ATmega1284P)
        run: |
          cmake -B build-transfer -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=avr-toolchain.cmake \
            -DAVR_MCU=atmega1284p \
            -DAVR_F_CPU=16000000UL \
            -DAVR_CRC32_IMPL=${{ matrix.crc_impl }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          if ! cmake --build build-transfer --target pw_transfer_upstream_probe.elf pw_rpc_upstream_probe.elf > build-transfer/transfer-build.log 2>&1; then
            tail -n 160 build-transfer/transfer-build.log
            exit 1
          fi
          tail -n 30 build-transfer/transfer-build.log

      - name: Run upstream pw_rpc unary and bidirectional probe (ATmega1284P)
        run: |
          # The two-endpoint HDLC/RPC probe needs more SRAM than ATmega328P.
          # The MCU-under-test Bridge footprint is checked separately on 32U4.
          set +e
          timeout 5s simavr -m atmega1284p build-transfer/pw_rpc_upstream_probe.elf > build-transfer/pw_rpc_probe.log 2>&1
          simavr_status=$?
          set -e
          cat build-transfer/pw_rpc_probe.log
          echo "simavr exit status: ${simavr_status}; UART marker is authoritative"
          grep -q "PW_RPC_PROBE_PASS" build-transfer/pw_rpc_probe.log

      - name: Run cooperative pw_transfer probe (ATmega1284P)
        run: |
          # The UART marker is emitted only after all transfer assertions.
          set +e
          timeout 5s simavr -m atmega1284p build-transfer/pw_transfer_upstream_probe.elf > build-transfer/pw_transfer_probe.log 2>&1
          simavr_status=$?
          set -e
          cat build-transfer/pw_transfer_probe.log
          echo "simavr exit status: ${simavr_status}; UART marker is authoritative"
          grep -q "PW_TRANSFER_PROBE_PASS" build-transfer/pw_transfer_probe.log

      - name: Configure ATmega1284P shared-thread footprint
        run: |
          cmake -B build-transfer-1284p -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=avr-toolchain.cmake \
            -DAVR_MCU=atmega1284p \
            -DAVR_F_CPU=16000000UL \
            -DAVR_CRC32_IMPL=${{ matrix.crc_impl }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build ATmega1284P shared-thread footprint
        run: |
          if ! cmake --build build-transfer-1284p --target pw_transfer_avr_footprint_probe.elf > build-transfer-1284p/footprint-build.log 2>&1; then
            tail -n 160 build-transfer-1284p/footprint-build.log
            if [ -f build-transfer-1284p/pw_transfer_avr_footprint_probe.map ]; then
              echo "===== Largest SRAM map entries ====="
              grep -E '^\\.data|^\\.bss|^ *0x[0-9a-fA-F]+ +0x[0-9a-fA-F]+ ' build-transfer-1284p/pw_transfer_avr_footprint_probe.map | tail -n 180
            fi
            exit 1
          fi
          tail -n 30 build-transfer-1284p/footprint-build.log
          echo "===== Largest static SRAM symbols ====="
          avr-nm -S --size-sort --radix=d build-transfer-1284p/pw_transfer_avr_footprint_probe.elf | grep -E ' [bBdD] ' | tail -n 60 || true

      - name: Run Pigweed AVR Test Suite in simavr
        run: |
          if ! simavr -m ${AVR_MCU} build/test_runner.elf > build/test_runner.log 2>&1; then
            cat build/test_runner.log
            exit 1
          fi
          cat build/test_runner.log
          grep -q "100% OF PORTED PIGWEED MODULES VERIFIED OK!" build/test_runner.log
          ccache --show-stats

      - name: Verify Python Host Tools & Arduino Export
        if: matrix.crc_impl == 'PW_CHECKSUM_CRC32_4BITS'
        run: |
          python3 -m py_compile tools/receive_telemetry.py tools/export_arduino_library.py
          python3 tools/export_arduino_library.py
          test -s dist/PigweedAVR/src/pw_rpc/internal/packet.pwpb.h
          test -s dist/PigweedAVR/src/pw_rpc/server.h
          test -s dist/PigweedAVR/src/pw_rpc/client.h
          test -s dist/PigweedAVR/src/pw_rpc_client.cc
          test -s dist/PigweedAVR/src/pw_rpc_client_call.cc
          test -s dist/PigweedAVR/src/pw_protobuf/encoder.h
          test -s dist/PigweedAVR/src/pw_transfer/transfer_thread.h
          test -s dist/PigweedAVR/src/pw_transfer/transfer.raw_rpc.pb.h
          test -s dist/PigweedAVR/src/pw_transfer/transfer.pwpb.h
          grep -q "define PW_TRANSFER_COOPERATIVE 1" dist/PigweedAVR/src/pw_transfer/transfer_thread.h
          avr-g++ -mmcu=atmega32u4 -DF_CPU=16000000UL -std=gnu++17 \
            -fsyntax-only -Idist/PigweedAVR/src tools/ci/arduino_export_probe.cpp

      - name: Upload Build Artifacts
        if: matrix.crc_impl == 'PW_CHECKSUM_CRC32_4BITS'
        uses: actions/upload-artifact@v4
        with:
          name: avr-pigweed-firmware
          path: |
            build/firmware.hex
            build/firmware.lst
            build/test_runner.elf
